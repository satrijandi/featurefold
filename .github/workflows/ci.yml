name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deliberately no UV_SYSTEM_PYTHON here. It makes `uv pip install` skip the
# .venv that `uv venv` just created and target the runner's system Python,
# which is externally managed and refuses the install.

jobs:

  # ---------------------------------------------------------------------------
  # The core repository: a spec compiler and nothing else. This job installs no
  # dbt, no warehouse and no object store, which is the point -- if compiling a
  # spec ever needed one of them, this job would stop working.
  #
  # It is also the GitOps gate. A spec and its generated models cannot be
  # allowed to disagree, so it regenerates from the specs and fails on any
  # difference. Hand-editing a model, or changing a spec without regenerating,
  # stops here.
  # ---------------------------------------------------------------------------
  generator:
    name: generator (drift, lint, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev]"

      - name: The compiler pulls in no runtime
        # A dependency on dbt would make the compiler impossible to embed
        # anywhere that does not already run dbt. Assert it rather than trust it.
        run: |
          if .venv/bin/python -c "import dbt" 2>/dev/null; then
            echo "dbt is installed by the core package; it must not be"; exit 1
          fi
          echo "core install has no dbt, as intended"

      - name: Specs are valid
        run: .venv/bin/python -m generator.cli validate

      - name: Generated output matches the specs
        run: .venv/bin/python -m generator.cli generate --check

      - name: Example specs in the authoring reference still parse
        run: make examples

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

  # ---------------------------------------------------------------------------
  # The showcase: runs the generated project against DuckDB. A backfill, a
  # sequence of daily increments, every generated invariant, adapter
  # conformance, an independent brute-force recomputation, and the operational
  # scenarios (retry, gap, late arrival, replay, revision, ordering). This is
  # the job that would catch a wrong number.
  #
  # Everything it runs is a target in showcase/Makefile, so CI and a laptop take
  # exactly the same path.
  # ---------------------------------------------------------------------------
  pipeline:
    name: showcase (dbt + invariants + brute force)
    runs-on: ubuntu-latest
    needs: generator
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the compiler plus a dbt runtime
        run: cd showcase && uv venv --python 3.11 && uv pip install -e .. -e .

      - name: The whole end-to-end gate
        # One target, so CI and a laptop take exactly the same path: lint, unit
        # tests, dbt_project_evaluator over the project's structure, fixture,
        # backfill, a fortnight of increments with the revision window refreshed
        # behind each one, sqlfluff over both sides of every incremental branch,
        # every generated invariant, source history tests, adapter conformance,
        # brute-force recomputation on five dates, sketch accuracy, the
        # operational scenarios, and a docs build.
        run: make -C showcase ci

      - name: No partition references events after its own as-of date
        # Independently of the pipeline that produced it: a separate process,
        # reading the marts directly, over both specs.
        run: |
          showcase/.venv/bin/python - <<'PY'
          import duckdb, sys
          con = duckdb.connect("showcase/warehouse.duckdb", read_only=True)
          bad = 0
          for m in ("fact_agg_features_login_history_v2",
                    "fact_agg_features_login_device_v1"):
              n = con.execute(
                  f"select count(*) from marts.{m} "
                  "where _last_event_date > target_date"
              ).fetchone()[0]
              print(f"{m}: {n} leaking row(s)")
              bad += n
          sys.exit(1 if bad else 0)
          PY

      - name: The generated project is unchanged by running it
        # Executing the pipeline must not write anything back into the committed
        # dbt project: it is generator output, and a stray artefact there would
        # show up as drift in someone else's pull request.
        run: git diff --exit-code --stat -- transform && git status --porcelain -- transform

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-artifacts
          path: |
            showcase/target/manifest.json
            showcase/target/run_results.json
            showcase/logs/dbt.log
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The DAG is generated from the registry, so a spec change can break DAG
  # import. Catch that here rather than in the scheduler.
  # ---------------------------------------------------------------------------
  orchestration:
    name: orchestration (DAG imports)
    runs-on: ubuntu-latest
    needs: generator
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      - run: uv pip install "apache-airflow==2.10.5" pendulum
      # The DAG reads the registry through generator.registry, installed as the
      # Airflow image installs it: without the compiler's dependencies, which
      # also proves reading the contract does not need them.
      - run: uv pip install --no-deps -e .

      - name: DAG parses and has no import errors
        run: |
          export AIRFLOW_HOME="${{ github.workspace }}/.airflow"
          export FS_PROJECT_ROOT="${{ github.workspace }}"
          .venv/bin/python - <<'PY'
          import os
          from airflow.models import DagBag
          bag = DagBag(os.path.join(os.environ["FS_PROJECT_ROOT"],
                                    "showcase/orchestration/dags"),
                       include_examples=False)
          if bag.import_errors:
              for path, err in bag.import_errors.items():
                  print(f"{path}\n{err}")
              raise SystemExit(1)
          # bag.dags, not bag.get_dag: the latter reads the serialised DAG out
          # of the metadata database, which an import check has no reason to
          # stand up. Parsing the file is the whole point here.
          dag = bag.dags.get("feature_store_daily")
          if dag is None:
              print(f"feature_store_daily not found; parsed: {sorted(bag.dags)}")
              raise SystemExit(1)
          print(f"feature_store_daily: {len(dag.tasks)} tasks")
          for t in sorted(t.task_id for t in dag.tasks):
              print(f"  {t}")
          PY
