# The showcase's profile. It is deliberately not part of the generated dbt
# project: ../transform declares which profile it wants and nothing about how to
# connect, so the same committed models run unchanged here, on Databricks and on
# Snowflake. A production deployment supplies its own file in place of this one.
#
# DBT_DUCKDB_PATH is set by the Makefile and by the DAG. The bare default only
# applies when dbt is invoked by hand, and then resolves against the working
# directory.
featurefold:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:

    # --- local dev: DuckDB on the local filesystem --------------------------
    local:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'warehouse.duckdb') }}"
      schema: main
      threads: 4
      extensions: ["httpfs"]

    # --- CI / integration: DuckDB backed by SeaweedFS S3 --------------------
    seaweed:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'warehouse.duckdb') }}"
      schema: main
      threads: 4
      extensions: ["httpfs"]
      settings:
        # No defaults: credentials come from the environment only. See
        # tools/object_store.py for where each runner gets them.
        s3_endpoint: "{{ env_var('S3_ENDPOINT') }}"
        s3_access_key_id: "{{ env_var('S3_ACCESS_KEY') }}"
        s3_secret_access_key: "{{ env_var('S3_SECRET_KEY') }}"
        s3_use_ssl: false
        s3_url_style: "path"
        s3_region: "us-east-1"

    # --- production candidates ---------------------------------------------
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'gold') }}"
      schema: "{{ env_var('DATABRICKS_SCHEMA', 'feature_store') }}"
      threads: 8

    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORMER') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'GOLD') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'FEATURE_STORE') }}"
      threads: 8
