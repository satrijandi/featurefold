# =============================================================================
# The dbt project this repository compiles feature specs into.
#
# Everything under models/ and the assert_*.sql under tests/ is GENERATED from
# features/*.yml. What is hand-written here is the runtime the generated SQL
# depends on: the dialect adapter macros, the incremental strategies, and the
# conformance suite that proves an adapter implements them correctly.
#
# The project is deliberately warehouse-agnostic and data-free. It declares no
# profile connection and ships no fixture: a caller supplies both. The
# end-to-end showcase in ../showcase does exactly that, and so would a
# production deployment.
# =============================================================================
name: "featurefold"
version: "0.1.0"
config-version: 2

# Resolved from the caller's --profiles-dir. See ../showcase/profiles.yml for a
# worked example covering DuckDB, Databricks and Snowflake.
profile: "featurefold"

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# `target_date` is the as-of date every feature is computed for. Airflow passes
# the logical date here. There is deliberately no default: a silent wrong date
# is the worst failure mode in a point-in-time feature store.
vars:
  target_date: ""
  fs_kmv_k: 256

models:
  featurefold:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +schema: intermediate
    marts:
      +schema: marts
