# ==============================================================================
# 1. Global Configuration
# ==============================================================================
feature_name: "fact_agg_features_login_history_v2"
feature_type: "daily"
created_by: "data-platform"
description: |
  This table refers to bronze table customer_login.
  V2 is updated version from V1, which is adding all_time login features

# ==============================================================================
# 2. Data Source Configuration
# ==============================================================================
source: |
  SELECT
    customer_id AS safe_id,
    device_id,
    event_id,
    event_timestamp,
    DATEDIFF(DAY, event_timestamp, '{{ target_date }}'::DATE) AS days_since_login,
    login_source,
    os_name,
    event_status
  FROM bronze.events.customer_login
  WHERE customer_id IS NOT NULL

entities: ["safe_id"]
timestamp_col: "event_timestamp"

# ==============================================================================
# 3. Feature Condition Configuration
# ==============================================================================
# 3.1 Condition Categories
condition_cat:
  - login_status: # Login status categories
    - default: "TRUE"
    - is_login_success: "UPPER(event_status) = 'SUCCESS'"
    - is_login_failed: "UPPER(event_status) = 'FAILED'"

  - login_os: # Login OS categories
    - default: "TRUE"
    - is_ios: "UPPER(os_name) = 'IOS'"
    - is_android: "UPPER(os_name) = 'ANDROID'"
    - is_others: "UPPER(os_name) NOT IN ('IOS', 'ANDROID')"

  - behavioural_time: # Time when the customer is logging in
    - default: "TRUE"
    - is_late_night: "EXTRACT(HOUR FROM event_timestamp) BETWEEN 0 AND 4"
    - is_early_morning: "EXTRACT(HOUR FROM event_timestamp) BETWEEN 5 AND 8"
    - is_office_hours: "EXTRACT(HOUR FROM event_timestamp) BETWEEN 9 AND 17"
    - is_evening_leisure: "EXTRACT(HOUR FROM event_timestamp) BETWEEN 18 AND 23"

# 3.2 Time Condition Categories (Moving Window Features)
time_cat: ["l7d", "l14d", "l30d", "all_time"]

# ==============================================================================
# 4. Atomic Field Configuration
# ==============================================================================
atomic_field:
  # If the atomic field is existed from the source
  - event_id: # General Login Volume across OS, Status and Time Behaviourals
      apply_cond_cat: [login_status, login_os, behavioural_time]
      agg: ['count']

  - device_id: # To see device model diversity (how often they change device model)
      apply_cond_cat: [login_status, login_os]
      agg: ['count_distinct']

  - event_timestamp: # To see first time login and last time login features
      apply_cond_cat: [login_status, login_os]
      agg: ['min', 'max']
      field_type: timestamp

  - days_since_login: # To see how long the customer has been inactive (last time login)
      apply_cond_cat: [login_status, login_os]
      agg: ['min', 'max']
      field_type: numeric

# ==============================================================================
# 5. Physical Relation Mapping
# ==============================================================================
# Maps the hard-coded relation in `source` onto a dbt source, so the identical
# generated model reads a seeded fixture locally and the real bronze table in
# production. Generation fails if `source` reads a relation that is not mapped.
relations:
  bronze.events.customer_login:
    source_name: bronze_events
    table_name: customer_login
    # The journal is SCD2: a correction closes the old row version and opens a
    # new one, and a deletion closes it without a successor. The generator
    # reads every as-of date through these two columns, and uses them to find
    # the days whose content changed since the last run, however old.
    loaded_at: _scd_valid_from
    superseded_at: _scd_valid_to
    # The journal's naive timestamps are UTC wall-clock.
    timezone: UTC
    # A login keeps its event_id across corrections, so the staging model can
    # test that no two versions of one login are ever current at once.
    key: [event_id]

# ==============================================================================
# 6. Settings
# ==============================================================================
settings:
  # Only entities with activity inside the widest bounded window (l30d) get a
  # row on a given as-of date. Cheaper than all_time, which snapshots every
  # entity ever seen on every date, but it changes what a missing row means:
  # a dormant entity has no snapshot rather than a snapshot of zeros, so a
  # training-set join must decide explicitly how to treat one.
  entity_spine: active_window

  # The business day. Event dates, the late_night / office_hours buckets and the
  # end of each as-of day are all read on Jakarta's clock, whatever zone the
  # source records in and whatever the warehouse session is set to.
  timezone: Asia/Jakarta

# ==============================================================================
# 7. Consumers
# ==============================================================================
# Who reads the published mart. Each becomes a dbt exposure, so lineage runs
# from the bronze journal all the way to the things that would break.
exposures:
  - name: login_offline_store
    type: application
    owner: {name: data-platform}
    description: |
      Parquet offline store on S3, one partition per as-of date, written by
      showcase/tools/publish_offline_store.py after every daily run.
    maturity: medium
  - name: login_feature_validation
    type: notebook
    owner: {name: data-platform}
    description: |
      Validation notebook that reads the offline store the way a training
      pipeline would. showcase/notebooks/01_validate_feature_store.ipynb.
    maturity: low
