[project]
name = "featurefold"
version = "0.1.0"
description = "Config-driven feature store compiler: YAML feature specs into a dbt project"
requires-python = ">=3.11,<3.12"

# The compiler is pure Python on purpose. Compiling a spec into dbt models
# needs no warehouse, no dbt-core and no object store, so none of them are
# dependencies here -- installing this package cannot pull in a stack. What it
# takes to *run* the generated project is declared in showcase/pyproject.toml.
dependencies = [
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "pydantic>=2.9.0",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
featurefold = "generator.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
